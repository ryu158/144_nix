pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log;

events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name @domain@ @sb_domain@;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name @domain@;

        ssl_certificate /etc/letsencrypt/live/@domain@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@domain@/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 2G;
        client_body_buffer_size 128k;

        include /etc/nginx/mime.types;

        root /home/opc/nix/webUI;
        index index.html;

        location ~ \.conf$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
        
        location = /interpolate_blog {
            try_files /topics/interpolation/interpolate_blog.html =404;
        }

        location = /interpolate_cal {
            try_files /topics/interpolation/interpolate_cal.html =404;
        }

         location = /interpolate_adv {
            try_files /topics/interpolation/interpolate_adv.html =404;
        }

        # The site's one backend, shared by every topic. It binds 127.0.0.1, so
        # this block is its whole public face - same arrangement as syncthing.
        # No trailing slash on proxy_pass: Flask's own routes start with /api/.
        location /api/ {
            # Matches MAX_CONTENT_LENGTH in webUI/app.py. Without it the
            # server-wide 2G applies and an oversize body reaches Flask instead
            # of being refused here.
            client_max_body_size 8m;
            proxy_pass http://127.0.0.1:@api_port@;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

       location /dev_basic {
            index index_dev_basic.html;
            try_files $uri $uri/ =404;
        }

        location /test {
            try_files $uri $uri/ /topics/test/index_test.html =404;
        }

        # Syncthing GUI. Loopback-bound; this is its only public face.
        # Trailing slash on both sides strips the /syncthing prefix before proxying.
        location = /syncthing { return 301 /syncthing/; }
        location /syncthing/ {
            # NOT $host: syncthing's DNS-rebinding check 403s any Host it does not
            # recognise. It only trusts localhost while bound to loopback.
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:@st_port@/;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name @sb_domain@;

        ssl_certificate /etc/letsencrypt/live/@sb_domain@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@sb_domain@/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # matches SB_MAX_ATTACHMENT_SIZE=2048 in my_wiki_servers/silverbullet
        client_max_body_size 2G;
        client_body_buffer_size 128k;

        # SilverBullet binds 127.0.0.1 only; this block is its whole public face.
        location / {
            proxy_pass http://127.0.0.1:@sb_port@;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;      # SB syncs over websockets
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 35908;
        server_name localhost;

        root @web_root@;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

