pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log;

events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name @domain@;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name @domain@;

        ssl_certificate /etc/letsencrypt/live/@domain@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@domain@/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 2G;
        client_body_buffer_size 128k;

        include /etc/nginx/mime.types;

        root /home/opc/nix/webUI;
        index index.html;

        location ~ \.conf$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /interpolate_cal {
            try_files /topics/interpolation/interpolate_cal.html =404;
        }

        location = /interpolate_blog {
            try_files /topics/interpolation/interpolate_blog.html =404;
        }

        location /dev_basic {
            index index_dev_basic.html;
            try_files $uri $uri/ =404;
        }

        location /test {
            try_files $uri $uri/ /topics/test/index_test.html =404;
        }
    }

    server {
        listen 35908;
        server_name localhost;

        root @web_root@;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
